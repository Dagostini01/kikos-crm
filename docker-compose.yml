services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kikos_crm
      POSTGRES_USER: kikos
      POSTGRES_PASSWORD: kikos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kikos -d kikos_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
